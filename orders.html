<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBC – Reception Orders</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf3dc;--card:#fffaf0;--ink:#2a2a22;--green:#1f5a3a;--red:#a31621;--line:#e3d6b0;--chip:#f3e8c6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1f1a;--card:#262b24;--ink:#f1ecd9;--green:#6cc08f;--red:#ff7b86;--line:#3a4136;--chip:#323a2f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}
h1{font-family:Georgia,serif;color:var(--red);margin:4px 0;font-size:26px;text-align:center}
.sub{text-align:center;color:var(--green);font-weight:600;margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.q{display:block;font-weight:700;margin-bottom:8px;color:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--green);color:var(--bg);border-color:var(--green)}
input[type=text],input[type=tel],input[type=date],input[type=number],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:60px;resize:vertical}
.fld{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:9px 14px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;font-size:15px}
.opts input:checked+span{background:var(--green);color:var(--bg);border-color:var(--green);font-weight:600}
.opts input:focus-visible+span{outline:2px solid var(--red)}
.grp{font-size:12px;font-weight:700;opacity:.7;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.grp:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;font-size:15px}
.item .pr{width:64px;text-align:right}
.item .pr input{padding:6px;text-align:right}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.step b{min-width:22px;text-align:center}
.item.has .nm{font-weight:700;color:var(--green)}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:6px 0 10px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--green);color:var(--bg);font-size:17px;font-weight:700;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-size:15px;font-weight:600;padding:11px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.err{color:var(--red);font-size:14px;margin:0 0 10px;display:none;text-align:center}
.order{border-bottom:1px dashed var(--line);padding:10px 0}
.order:last-child{border-bottom:0}
.order .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.order .meta{font-size:13px;opacity:.75}
.order .lines{font-size:14px;margin:4px 0}
.order button{background:none;border:0;color:var(--red);font:inherit;font-size:13px;cursor:pointer;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--green)}
.stat span{font-size:12px;opacity:.75}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
th:not(:first-child),td:not(:first-child){text-align:right}
.status{font-size:12px;text-align:center;opacity:.75;margin:8px 0 0}
.empty{opacity:.6;text-align:center;padding:14px 0;font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>TBC – Reception Orders</h1>
<p class="sub">The Brunch Canopy</p>

<div class="tabs" id="tabs">
<button data-t="new" class="on">New order</button>
<button data-t="list">Orders</button>
<button data-t="eod">End of day</button>
</div>

<!-- NEW ORDER -->
<section id="t-new">
<div class="card"><div class="q">Items</div><div id="menu"></div></div>

<div class="card"><div class="q">Customer</div>
<label class="fld" for="nm">Name</label><input type="text" id="nm" autocomplete="off">
<div class="two">
<div><label class="fld" for="soc">Society</label><input type="text" id="soc" autocomplete="off"></div>
<div><label class="fld" for="flat">Flat no.</label><input type="text" id="flat" autocomplete="off"></div>
</div>
<label class="fld" for="ph">Contact number</label><input type="tel" id="ph" inputmode="tel" autocomplete="off">
</div>

<div class="card">
<div class="q">Order type</div>
<div class="opts" id="typeOpts">
<label><input type="radio" name="type" value="Dine-in" checked><span>Dine-in</span></label>
<label><input type="radio" name="type" value="Takeaway"><span>Takeaway</span></label>
<label><input type="radio" name="type" value="Delivery"><span>Delivery</span></label>
</div>
<div class="q" style="margin-top:14px">Payment</div>
<div class="opts">
<label><input type="radio" name="pay" value="Cash" checked><span>Cash</span></label>
<label><input type="radio" name="pay" value="UPI"><span>UPI</span></label>
<label><input type="radio" name="pay" value="Card"><span>Card</span></label>
<label><input type="radio" name="pay" value="Pending"><span>Pending</span></label>
</div>
<label class="fld" for="note">Note (optional)</label><textarea id="note" placeholder="Less spicy, no onion…"></textarea>
</div>

<p class="err" id="err">Please add at least one item.</p>
<div class="total"><span>Total</span><span id="total">₹0</span></div>
<button class="btn" id="add">Add order</button>
</section>

<!-- ORDERS LIST -->
<section id="t-list" class="hide">
<div class="card">
<label class="fld" for="ldate" style="margin-top:0">Date</label><input type="date" id="ldate">
</div>
<div class="card" id="olist"></div>
</section>

<!-- END OF DAY -->
<section id="t-eod" class="hide">
<div class="card">
<label class="fld" for="edate" style="margin-top:0">Date</label><input type="date" id="edate">
</div>
<div id="summary"></div>
</section>

<!-- DATA -->
<div class="card">
<div class="q">Data file (JSON)</div>
<div class="btns" style="margin-top:0">
<button class="btn sec" id="dl">⬇ Download JSON</button>
<button class="btn sec" id="ld">⬆ Load JSON</button>
</div>
<button class="btn sec" id="link" style="margin-top:8px">🔗 Auto-save to a JSON file (Chrome / Edge)</button>
<input type="file" id="file" accept=".json,application/json" class="hide">
<p class="status" id="status"></p>
</div>
</div>

<script>
/* ===== Menu (edit names here) ===== */
var MENU={
 'Parathas':['Aloo Paratha','Gobi Paratha','Paneer Paratha','Spinach Corn & Cheese Paratha','Mix Veg Paratha'],
 'Mains':['Aloo Puri','Amritsari Nutri (Soya) with Kulcha','Choley Bhature','Ghee Masala Dosa','Plain Dosa','Poha','Sabudana Khichdi','Paneer Bhurji and Parantha','Puri, Channa and Halwa','Sabudana Vada'],
 'Drinks':['Tea','Nimbu Pani']
};
var KEY='tbc_orders_v1';
var DB={orders:[],prices:{}};
var cart={};
var fileHandle=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){return new Date().toLocaleDateString('en-CA')}
function rs(n){return '₹'+(Math.round(n*100)/100).toLocaleString('en-IN')}

/* ===== Storage ===== */
function load(){
 try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);DB.orders=d.orders||[];DB.prices=d.prices||{}}}catch(e){}
}
async function save(){
 try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
 if(fileHandle){
  try{var w=await fileHandle.createWritable();await w.write(JSON.stringify(DB,null,2));await w.close();status('Saved to '+fileHandle.name+' ✔')}
  catch(e){status('Could not write to linked file – use Download JSON.')}
 }else status('Saved in this browser. Download JSON regularly as backup.');
}
function status(t){$('status').textContent=t}

/* ===== Menu UI ===== */
function buildMenu(){
 var h='';
 Object.keys(MENU).forEach(function(g){
  h+='<div class="grp">'+esc(g)+'</div>';
  MENU[g].forEach(function(n){
   var p=DB.prices[n]||'';
   h+='<div class="item" data-n="'+esc(n)+'"><div class="nm">'+esc(n)+'</div>'
    +'<div class="pr"><input type="number" inputmode="decimal" min="0" placeholder="₹" value="'+esc(p)+'" aria-label="Price of '+esc(n)+'"></div>'
    +'<div class="step"><button type="button" data-d="-1" aria-label="Less">−</button><b>0</b><button type="button" data-d="1" aria-label="More">+</button></div></div>';
  });
 });
 $('menu').innerHTML=h;
}
$('menu').addEventListener('click',function(e){
 var b=e.target.closest('button[data-d]');if(!b)return;
 var row=b.closest('.item'),n=row.dataset.n;
 cart[n]=Math.max(0,(cart[n]||0)+Number(b.dataset.d));
 if(!cart[n])delete cart[n];
 row.querySelector('b').textContent=cart[n]||0;
 row.classList.toggle('has',!!cart[n]);
 $('err').style.display='none';calc();
});
$('menu').addEventListener('input',function(e){
 if(e.target.tagName!=='INPUT')return;
 var n=e.target.closest('.item').dataset.n,v=parseFloat(e.target.value);
 if(v>0)DB.prices[n]=v;else delete DB.prices[n];
 try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(x){}
 calc();
});
function calc(){
 var t=0;Object.keys(cart).forEach(function(n){t+=cart[n]*(DB.prices[n]||0)});
 $('total').textContent=rs(t);return t;
}
function val(n){var e=document.querySelector('input[name="'+n+'"]:checked');return e?e.value:''}

/* ===== Add order ===== */
$('add').onclick=function(){
 var names=Object.keys(cart);
 if(!names.length){$('err').style.display='block';return}
 var d=today(),now=new Date();
 var no=DB.orders.filter(function(o){return o.date===d}).length+1;
 var items=names.map(function(n){return{name:n,qty:cart[n],price:DB.prices[n]||0}});
 var total=items.reduce(function(s,i){return s+i.qty*i.price},0);
 DB.orders.push({
  id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
  date:d,time:now.toTimeString().slice(0,5),no:no,
  name:$('nm').value.trim(),society:$('soc').value.trim(),flat:$('flat').value.trim(),phone:$('ph').value.trim(),
  type:val('type'),payment:val('pay'),note:$('note').value.trim(),items:items,total:total
 });
 save();
 cart={};['nm','soc','flat','ph','note'].forEach(function(i){$(i).value=''});
 document.querySelector('input[name="type"][value="Dine-in"]').checked=true;
 document.querySelector('input[name="pay"][value="Cash"]').checked=true;
 buildMenu();calc();
 window.scrollTo({top:0,behavior:'smooth'});
 status('Order #'+no+' added ✔');
 renderList();renderEod();
};

/* ===== Orders list ===== */
function renderList(){
 var d=$('ldate').value||today();
 var os=DB.orders.filter(function(o){return o.date===d}).sort(function(a,b){return b.no-a.no});
 if(!os.length){$('olist').innerHTML='<div class="empty">No orders for this date.</div>';return}
 $('olist').innerHTML=os.map(function(o){
  var who=[o.name,o.society,o.flat?('Flat '+o.flat):'',o.phone].filter(Boolean).join(' · ');
  return '<div class="order"><div class="top"><span>#'+o.no+' · '+esc(o.time)+'</span><span>'+rs(o.total)+'</span></div>'
   +'<div class="lines">'+o.items.map(function(i){return esc(i.qty+' × '+i.name)}).join('<br>')+'</div>'
   +'<div class="meta">'+esc(o.type)+' · '+esc(o.payment)+(who?' · '+esc(who):'')+(o.note?'<br>Note: '+esc(o.note):'')+'</div>'
   +'<button data-del="'+o.id+'">Delete</button></div>';
 }).join('');
}
$('olist').addEventListener('click',function(e){
 var id=e.target.dataset&&e.target.dataset.del;if(!id)return;
 if(!confirm('Delete this order?'))return;
 DB.orders=DB.orders.filter(function(o){return o.id!==id});
 save();renderList();renderEod();
});
$('ldate').onchange=renderList;

/* ===== End of day ===== */
function summarize(d){
 var os=DB.orders.filter(function(o){return o.date===d});
 var S={date:d,orders:os.length,items:0,revenue:0,byItem:{},byPay:{},byType:{},pending:0};
 os.forEach(function(o){
  S.revenue+=o.total;
  S.byPay[o.payment]=(S.byPay[o.payment]||0)+o.total;
  S.byType[o.type]=(S.byType[o.type]||0)+1;
  if(o.payment==='Pending')S.pending+=o.total;
  o.items.forEach(function(i){
   S.items+=i.qty;
   var r=S.byItem[i.name]||(S.byItem[i.name]={qty:0,amt:0});
   r.qty+=i.qty;r.amt+=i.qty*i.price;
  });
 });
 return S;
}
function summaryText(S){
 var L=['*TBC – End of day: '+S.date+'*','Orders: '+S.orders+' | Items sold: '+S.items+' | Sales: '+rs(S.revenue),''];
 Object.keys(S.byItem).sort(function(a,b){return S.byItem[b].qty-S.byItem[a].qty}).forEach(function(n){
  L.push(S.byItem[n].qty+' × '+n+(S.byItem[n].amt?' – '+rs(S.byItem[n].amt):''));
 });
 L.push('');
 Object.keys(S.byPay).forEach(function(p){L.push(p+': '+rs(S.byPay[p]))});
 Object.keys(S.byType).forEach(function(t){L.push(t+': '+S.byType[t]+' orders')});
 return L.join('\n');
}
function renderEod(){
 var d=$('edate').value||today(),S=summarize(d);
 if(!S.orders){$('summary').innerHTML='<div class="card empty">No orders for this date.</div>';return}
 var names=Object.keys(S.byItem).sort(function(a,b){return S.byItem[b].qty-S.byItem[a].qty});
 var h='<div class="stats"><div class="stat"><b>'+S.orders+'</b><span>Orders</span></div>'
  +'<div class="stat"><b>'+S.items+'</b><span>Items sold</span></div>'
  +'<div class="stat"><b>'+rs(S.revenue)+'</b><span>Sales</span></div></div>';
 h+='<div class="card"><div class="q">Items sold</div><table><tr><th>Item</th><th>Qty</th><th>Amount</th></tr>'
  +names.map(function(n){return '<tr><td>'+esc(n)+'</td><td>'+S.byItem[n].qty+'</td><td>'+rs(S.byItem[n].amt)+'</td></tr>'}).join('')+'</table></div>';
 h+='<div class="card"><div class="q">Payments</div><table>'
  +Object.keys(S.byPay).map(function(p){return '<tr><td>'+esc(p)+'</td><td>'+rs(S.byPay[p])+'</td></tr>'}).join('')+'</table>'
  +'<div class="q" style="margin-top:12px">Order types</div><table>'
  +Object.keys(S.byType).map(function(t){return '<tr><td>'+esc(t)+'</td><td>'+S.byType[t]+'</td></tr>'}).join('')+'</table></div>';
 h+='<div class="btns"><button class="btn sec" id="cp">📋 Copy summary</button><button class="btn sec" id="wa">WhatsApp summary</button></div>'
  +'<div class="btns"><button class="btn sec" id="csv">⬇ Download CSV</button><button class="btn sec" id="sj">⬇ Summary JSON</button></div>';
 $('summary').innerHTML=h;
 $('cp').onclick=function(){
  var t=summaryText(S);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){status('Summary copied ✔')},function(){prompt('Copy:',t)});
  else prompt('Copy:',t);
 };
 $('wa').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(summaryText(S)),'_blank')};
 $('csv').onclick=function(){
  var rows=[['Date','Time','Order no','Name','Society','Flat','Phone','Type','Payment','Item','Qty','Price','Line total','Note']];
  DB.orders.filter(function(o){return o.date===d}).forEach(function(o){
   o.items.forEach(function(i){rows.push([o.date,o.time,o.no,o.name,o.society,o.flat,o.phone,o.type,o.payment,i.name,i.qty,i.price,i.qty*i.price,o.note])});
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  download('tbc-orders-'+d+'.csv',csv,'text/csv');
 };
 $('sj').onclick=function(){download('tbc-summary-'+d+'.json',JSON.stringify(S,null,2),'application/json')};
}
$('edate').onchange=renderEod;

/* ===== Files ===== */
function download(name,text,type){
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
 document.body.appendChild(a);a.click();a.remove();
}
$('dl').onclick=function(){download('tbc-orders-'+today()+'.json',JSON.stringify(DB,null,2),'application/json')};
$('ld').onclick=function(){$('file').click()};
$('file').onchange=function(){
 var f=this.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  try{
   var d=JSON.parse(r.result),have={};
   DB.orders.forEach(function(o){have[o.id]=1});
   (d.orders||[]).forEach(function(o){if(!have[o.id])DB.orders.push(o)});
   Object.keys(d.prices||{}).forEach(function(k){if(!DB.prices[k])DB.prices[k]=d.prices[k]});
   save();buildMenu();renderList();renderEod();status('Loaded '+(d.orders||[]).length+' orders from file ✔');
  }catch(e){alert('That file is not a valid orders JSON.')}
 };
 r.readAsText(f);this.value='';
};
$('link').onclick=async function(){
 if(!window.showSaveFilePicker){alert('Auto-save needs Chrome or Edge on a computer/Android. Use Download JSON instead.');return}
 try{
  fileHandle=await window.showSaveFilePicker({suggestedName:'tbc-orders.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
  await save();$('link').textContent='🔗 Linked: '+fileHandle.name;
 }catch(e){}
};

/* ===== Tabs ===== */
$('tabs').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 [].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});
 ['new','list','eod'].forEach(function(t){$('t-'+t).classList.toggle('hide',t!==b.dataset.t)});
 if(b.dataset.t==='list')renderList();
 if(b.dataset.t==='eod')renderEod();
});

/* ===== Init ===== */
load();
$('ldate').value=today();$('edate').value=today();
buildMenu();calc();renderList();renderEod();
status(DB.orders.length?'Loaded '+DB.orders.length+' saved orders.':'No orders yet.');
</script>
</body>
</html>
